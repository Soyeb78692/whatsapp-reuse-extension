<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Quick Chat+</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      width: 340px;
      padding: 16px;
      margin: 0;
      background: #fff;
    }
    h3 {
      margin: 0 0 16px 0;
      color: #25D366;
      font-size: 18px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #25D366;
    }
    textarea {
      resize: vertical;
      min-height: 64px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .row > .country {
      width: 40%;
      margin: 8px 0;
    }
    .row > .number {
      width: 60%;
      margin: 8px 0;
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: -2px;
    }
    .checkRow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #333;
      margin: 8px 0;
    }
    .checkRow input {
      width: auto;
      margin: 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #25D366;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      margin-top: 8px;
    }
    button:hover:not(:disabled) {
      background: #20ba5a;
    }
    button:active:not(:disabled) {
      background: #1ea04d;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button:focus {
      outline: 2px solid #25D366;
      outline-offset: 2px;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      min-height: 16px;
      transition: color 0.2s;
    }
    .sectionLabel {
      margin-top: 10px;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #444;
    }
  </style>
</head>
<body>
  <h3>WhatsApp Quick Chat+</h3>
  <div class="sectionLabel">Phone Number</div>
  <div class="row">
    <select id="countryCode" class="country" aria-label="Country code">
      <option value="+91">+91 India</option>
      <option value="+1">+1 USA/Canada</option>
      <option value="+44">+44 UK</option>
      <option value="+49">+49 Germany</option>
      <option value="+33">+33 France</option>
      <option value="+39">+39 Italy</option>
      <option value="+34">+34 Spain</option>
      <option value="+61">+61 Australia</option>
      <option value="+64">+64 New Zealand</option>
      <option value="+65">+65 Singapore</option>
      <option value="+60">+60 Malaysia</option>
      <option value="+66">+66 Thailand</option>
      <option value="+81">+81 Japan</option>
      <option value="+82">+82 South Korea</option>
      <option value="+86">+86 China</option>
      <option value="+7">+7 Kazakhstan/Russia</option>
      <option value="+20">+20 Egypt</option>
      <option value="+27">+27 South Africa</option>
      <option value="+55">+55 Brazil</option>
      <option value="+52">+52 Mexico</option>
      <option value="+92">+92 Pakistan</option>
      <option value="+880">+880 Bangladesh</option>
      <option value="+971">+971 UAE</option>
      <option value="+966">+966 Saudi Arabia</option>
    </select>
    <input id="phoneInput" class="number" type="tel" placeholder="9876543210" aria-label="Phone number" />
  </div>
  <div class="hint">Enter number without +. Country code comes from the dropdown.</div>

  <div class="sectionLabel">Optional Message</div>
  <textarea id="messageInput" placeholder="Type a message to prefill in WhatsApp..." aria-label="Message"></textarea>
  <label class="checkRow">
    <input id="rememberMessage" type="checkbox" />
    Remember this message
  </label>

  <div class="sectionLabel">Open Behavior</div>
  <select id="reuseMode" aria-label="Tab reuse mode">
    <option value="reuse">Reuse existing WhatsApp tab</option>
    <option value="new_tab">Always open in new tab</option>
  </select>

  <div class="sectionLabel">Recent Numbers</div>
  <select id="recentNumbers" aria-label="Recent numbers">
    <option value="">No recent numbers</option>
  </select>
  <button id="clearDataBtn" type="button" aria-label="Clear local memory">Clear Local Memory</button>
  <div class="hint">Only local data is stored (preferences, recent numbers, last message/chat).</div>

  <button id="openBtn" aria-label="Open WhatsApp chat">Open Chat</button>
  <div class="status" id="status" role="status" aria-live="polite">Extension will reuse any open WhatsApp Web tab.</div>
  <script src="wa-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
